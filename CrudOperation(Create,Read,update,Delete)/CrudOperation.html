<!DOCTYPE html>
<html>
    <head>
        <title>Crud Operation</title>
        <script src="CrudOperation.js"></script>
    </head>
    <body>
        <h2>Crud Operation</h2>
        <label for="lblTitle">Title</label>
        <input id="txtTitle" placeholder="Enter the Movie name">
        <label for="lblDirector">Director</label>
        <input id="txtDirector" placeholder="ex: Sukumar, Rajamouli...">
        <label for="lblBudget">Budget</label>
        <input id="txtBudget" placeholder="ex: 1 crore, 75 lakhs...">
        <label for="lblGenere">Genre</label>
        <input id="txtGenre" placeholder="ex: sci-fi, thriller...">
        <label for="lblHero">Hero</label>
        <input id="txtHero" placeholder="ex: prabas, ramcharan...">
        <label for="lblHeroin">Heroin</label>
        <input id="txtHeroin" placeholder="ex: samantha, kajol...">
        <label for="lblRating">Rating</label>
        <input id="txtRating" placeholder="ex: 8.8, 9.2...">

        <button onclick="onClickToCreate()">Create</button>
        <div id="divCreate"></div>
        <button onclick="onClickToRead()">Read</button>
        <div id="divRead"></div>
        <button onclick="onClickToUpdate()">Update</button>
        <div id="divUpdate"></div>
        <button onclick="onClickToDelete()">Delete</button>
        <div id="divDelete"></div>
    </body>
</html>
