<!DOCTYPE html>
<html>
    <head>
        <title>Fruits Local Storage</title>
        <script src="FruitsLocalStorage.js"></script>
    </head>
    <body>
        <h2>Fruits Local Storage</h2>
        <label for="txtFruitName">Fruit Name</label>
    <input type="text" id="txtFruitName" placeholder="Enter the fruit name"><br><br>
    <select id="Category" >
        <option value="">Select Category</option>
        <option value="local">Local</option>
        <option value="hybrid">Hybrid</option>
    </select><br><br>
    <label for="txtPrice">Price per kg</label>
    <input type="number" id="txtPrice" placeholder="Enter the price per kg"><br><br>
    <select id="Country" >
        <option value="">Select country</option>
        <option value="india">India</option>
        <option value="china">China</option>
        <option value="brazil">Brazil</option>
        <option value="unitedStates">United States</option>
        <option value="mexico">Mexico</option>
        <option value="turkey">Turkey</option>
        <option value="indonesia">Indonesia</option>
        <option value="spain">Spain</option>
        <option value="italy">Italy</option>
        <option value="iran">Iran</option>
    </select><br><br>
    <select id="State" >
        <option value="">Select State</option>
        <option value="local">Andhra Pradesh</option>
        <option value="hybrid">Maharastra</option>
        <option value="Jammu">Jammu and Kashmir</option>
        <option value="TamilNadu">TamilNadu</option>
        <option value=""></option>
    </select><br><br>
    
    <label for="txtQuantity">Quantity in kgs</label>
    <input type="text" id="txtQuantity" placeholder="Enter the quantity in kgs"><br><br>
    <button onclick="onClickArrayObjects()">Enter</button>
    <div id="divFruits"></div>
    </body>
</html>
